<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 基础标题（会被 SEO 脚本覆盖） -->
    <title>九〇后的精选影视 - 导航主页</title>
    
    <!-- 网站图标 -->
    <link rel="icon" href="./docs/favicon.png" type="image/png">
    
    <!-- 样式表 -->
    <link href="./docs/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./docs/css/style.css">
    
    <!-- Bootstrap 框架脚本 -->
    <script src="./docs/js/bootstrap.bundle.min.js"></script>
    
    <!-- CDN 加速配置（必须最先加载）-->
    <script src="./docs/js/cdn-config.js"></script>
    
    <!-- SEO 优化脚本 -->
    <script src="./docs/js/seo-meta.js"></script>
</head>
<body>
    <div class="container my-3 sticky-top">
      <div class="header-container">
          <h1 class="header-title">
              <img src="./docs/movies.png" alt="logo" class="header-logo">
          </h1>
          
          <!-- 全局搜索框 -->
          <div class="search-container">
              <div class="input-group">
                  <input type="text" 
                         class="form-control" 
                         id="globalSearchInput" 
                         placeholder="搜索电影/剧集..." 
                         aria-label="搜索">
                  <button class="btn btn-primary" type="button" id="globalSearchBtn">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                      </svg>
                      搜索
                  </button>
              </div>
          </div>
          
          <span class="header-explanation">
              本站所有资源下载均需 <a target="_blank" href="https://www.7-zip.org/">7-Zip</a> 工具解压<br/>如遇解压密码错误，可加 QQ 群 209442520 处理
          </span>
      </div>
      <div class="card-container" id="cardContainer"></div>
    </div>

      <hr/>

      <div class="container my-5">
          <h2 style="text-align: center; padding: 15px; margin-bottom: 20px; font-weight: bold; color: #d4af37; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
              📺 九〇后的精选影视 📺
          </h2>
          
          <div class="row mt-4">

<!-- TODO -->


          </div>
      </div>

      <hr/>

      <!-- 回到顶部按钮 -->
      <button id="backToTop" class="back-to-top" onclick="scrollToTop()" title="回到顶部">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z"/>
          </svg>
      </button>
      
      <!-- 搜索结果模态框 -->
      <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="searchModalLabel">搜索结果</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="searchResults">
                    <div class="text-center text-muted">
                        <p>正在搜索...</p>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>

    <!-- 脚本 -->
    <script>
        // 回到顶部功能
        window.onscroll = function() {
            const backToTopBtn = document.getElementById('backToTop');
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                backToTopBtn.style.display = 'block';
            } else {
                backToTopBtn.style.display = 'none';
            }
        };

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 页面加载统计（可选）
        console.log('📺 经典影视作品导航');
        console.log('⚡ 加载时间：', performance.now().toFixed(2) + 'ms');
    </script>
    
    <!-- 全局搜索功能 -->
    <script src="./docs/js/global-search.js"></script>
    
    <!-- 徽章数字自动统计 -->
    <script src="./docs/js/count-badges.js"></script>
    
    <!-- 页面保护脚本 -->
    <script src="./docs/js/protection.min.js" defer></script>
</body>
</html>
