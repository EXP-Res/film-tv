<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 基础标题（会被 SEO 脚本覆盖） -->
    <title>{{PAGE_TITLE}} - 经典影视作品</title>
    
    <!-- 网站图标 -->
    <link rel="icon" href="{{BASE_PATH}}docs/favicon.png" type="image/png">
    
    <!-- 样式表 -->
    <link href="{{BASE_PATH}}docs/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{BASE_PATH}}docs/css/style.css" rel="stylesheet">
    
    <!-- Bootstrap 框架脚本 -->
    <script src="{{BASE_PATH}}docs/js/bootstrap.bundle.min.js"></script>
    
    <!-- SEO 优化脚本 -->
    <script src="{{BASE_PATH}}docs/js/seo-meta.js"></script>
</head>
<body>
    <!-- 支付模态框 -->
    <div class="modal fade" id="downloadModal" tabindex="-1" aria-labelledby="downloadModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title" id="downloadModalLabel">请在 60 秒内<font color="red">支付 5 元</font>后下载：</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                  <div class="d-flex justify-content-around">
                      <img src="{{BASE_PATH}}imgs/pay/alipay.png" class="img-fluid" alt="alipay" width="33%">
                      <img src="{{BASE_PATH}}imgs/pay/wechat.png" class="img-fluid" alt="wechat" width="33%">
                      <img src="{{BASE_PATH}}imgs/pay/QQ.png" class="img-fluid" alt="QQ" width="33%">
                  </div>
                  <div id="downloadInfo" style="display: none; margin-top: 20px;">
                      <hr>
                      <div class="alert alert-info">
                          <p><strong>下载链接：</strong><a id="modalDownloadLink" href="#" target="_blank">[点我下载]</a></p>
                          <p class="d-flex justify-content-between align-items-center">
                              <span>
                                  <strong>提取码：</strong>
                                  <span id="modalExtractCode"></span>
                              </span>
                              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('modalExtractCode', event)">
                                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
                                      <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                                      <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                                  </svg>
                                  复制
                              </button>
                          </p>
                          <p class="d-flex justify-content-between align-items-center">
                              <span>
                                  <strong>解压密码：</strong>
                                  <span id="modalUUID"></span>
                              </span>
                              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('modalUUID', event)">
                                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
                                      <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                                      <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                                  </svg>
                                  复制
                              </button>
                          </p>
                      </div>
                  </div>
              </div>
              <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" onclick="closeModal()">取消下载</button>
                  <button type="button" class="btn btn-primary" id="confirmButton" disabled>我已支付 (60)</button>
              </div>
          </div>
      </div>
    </div>

    <!-- 页面头部 -->
    <div class="container my-3 sticky-top">
      <div class="header-container">
          <h1 class="header-title">
              <img src="../docs/movies.png" alt="logo" style="height: 120px;">
          </h1>
          <span class="header-explanation">
              本站所有资源下载均需 <a target="_blank" href="https://www.7-zip.org/">7-Zip</a> 工具解压<br/>如遇解压密码错误，可加 QQ 群 209442520 处理
          </span>
      </div>
      <div class="card-container" id="cardContainer"></div>
    </div>

    <hr/>
